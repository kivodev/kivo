name: chromecast

# Publishes the Cast receiver to GitHub Pages at https://cast.kivo.watch.
# There is no build: the tests run, then the page, its stylesheet, its logo
# and src/ are published as they are.
on:
  push:
    branches: [main]
    paths:
      - clients/chromecast/**
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    defaults:
      run:
        working-directory: clients/chromecast
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm test
      - run: |
          mkdir -p "$RUNNER_TEMP/site"
          cp -R index.html receiver.css lockup.svg src "$RUNNER_TEMP/site"/
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: ${{ runner.temp }}/site
      - id: deploy
        uses: actions/deploy-pages@v5.0.1
