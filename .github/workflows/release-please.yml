name: release-please

# Keeps a release PR open on main with the next version, worked out from the
# Conventional Commit titles merged since the last release. Merging that PR
# tags the release and writes its notes to GitHub Releases, then the server
# image is published to ghcr.io/kivodev/kivo. A release made with
# GITHUB_TOKEN starts no other workflow, so the image job lives here.
#
# Run it by hand with a tag (v0.3.1) to publish that release's image again.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish, for example v0.3.1
        required: true

permissions: {}

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v5.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: .github/release-please-config.json
          manifest-file: .github/.release-please-manifest.json

  image:
    needs: release-please
    if: >-
      !cancelled() && (github.event_name == 'workflow_dispatch' ||
      needs.release-please.outputs.release_created == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - id: release
        env:
          TAG: ${{ inputs.tag || needs.release-please.outputs.tag_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::not a release tag: $TAG"
            exit 1
          fi
          newest="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)"
          {
            echo "tag=$TAG"
            echo "version=${TAG#v}"
            echo "latest=$([ "$TAG" = "$newest" ] && echo true || echo false)"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ steps.release.outputs.tag }}
      - id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          # Reads the revision from the checked-out tag, not the run's commit.
          context: git
          images: ghcr.io/${{ github.repository }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ steps.release.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.release.outputs.tag }}
            type=raw,value=latest,enable=${{ steps.release.outputs.latest }}
          labels: |
            org.opencontainers.image.description=Kivo media server
            org.opencontainers.image.licenses=AGPL-3.0-only
      - uses: docker/login-action@v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: server/Dockerfile
          # amd64 only for now. The Dockerfile has an arm64 path (it skips
          # Intel's amd64-only OpenCL runtimes), but it hasn't been tested,
          # and building it here would run the whole build under QEMU.
          platforms: linux/amd64
          build-args: VERSION=${{ steps.release.outputs.version }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
