name: openapi-dispatch

# Tells the website to rebuild its API reference when the spec changes.
on:
  push:
    branches: [main]
    paths:
      - server/internal/api/openapi.yaml

permissions: {}

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697 # v4.0.1
        with:
          token: ${{ secrets.WEBSITE_DISPATCH_TOKEN }}
          repository: kivodev/website
          event-type: openapi-changed
          client-payload: '{"sha": "${{ github.sha }}"}'
