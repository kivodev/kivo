name: pr-title

# PRs are squash-merged, so a PR's title becomes its commit on main and
# release-please reads it. This holds titles to Conventional Commits.
on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            refactor
            docs
            test
            build
            ci
            chore
          scopes: |
            server
            web
            core
            android
            apple
            tizen
            cast
            docs
            deps
          requireScope: false
          # Starts with a lowercase letter and doesn't end with a period.
          subjectPattern: ^(?![A-Z]).*[^.]$
          subjectPatternError: |
            The description "{subject}" in "{title}" should start with a
            lowercase letter and not end with a period.
