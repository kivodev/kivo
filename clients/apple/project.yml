# The Apple apps' Xcode project, generated by
# XcodeGen: `xcodegen generate` writes Kivo.xcodeproj, which isn't
# committed. FIRST-RUN.md says what to install and run first.
name: Kivo
minimumXcodeGenVersion: 2.46.0

options:
  bundleIdPrefix: com.kivo
  deploymentTarget:
    iOS: "18.0"
    tvOS: "18.0"
  createIntermediateGroups: true
  groupSortPosition: top

configFiles:
  Debug: Config/Kivo.xcconfig
  Release: Config/Kivo.xcconfig

settings:
  base:
    # Swift 5 language mode: the Kotlin types SKIE exposes aren't Sendable,
    # which Swift 6's checking would reject at every async call into the core.
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    ENABLE_USER_SCRIPT_SANDBOXING: NO

settingGroups:
  # The version both apps and the Top Shelf extension say.
  appVersion:
    MARKETING_VERSION: 0.3.0 # x-release-please-version
    # A small counter, raised for each TestFlight upload: Google Cast
    # aborts at launch on a long one (2026102401), so the iPhone app's
    # build stops on more than four digits.
    CURRENT_PROJECT_VERSION: 1
  # The Kotlin core is a static framework: the system frameworks it calls
  # are linked into each app, with the C++ runtime Kotlin/Native needs.
  coreLinking:
    OTHER_LDFLAGS:
      - $(inherited)
      - -framework Security
      - -framework VideoToolbox
      - -framework CoreMedia
      - -framework AVFAudio
      - -lc++
      # The download store's SQLite, through SQLDelight's native driver.
      - -lsqlite3
      # libass converts text encodings with the system's iconv.
      - -liconv

packages:
  Nuke:
    url: https://github.com/kean/Nuke
    exactVersion: 13.2.0
  # Google's own Swift package for the Cast sender SDK.
  GoogleCast:
    url: https://github.com/googlecast/google-cast-ios-sdk
    exactVersion: 4.8.6
  # libass (ISC) with FreeType (FTL), HarfBuzz (MIT), FriBidi (LGPL 2.1)
  # and libunibreak (zlib), prebuilt static by MPVKit, for drawing ASS.
  Libass:
    url: https://github.com/mpvkit/libass-build
    exactVersion: 0.17.5

aggregateTargets:
  # Builds KivoCore.xcframework and KivoUI's tokens with Gradle before
  # anything compiles, so the app and KivoUI depend on it.
  KivoCore:
    buildScripts:
      - name: Build KivoCore.xcframework
        script: '"$SRCROOT/scripts/build-core.sh"'
        basedOnDependencyAnalysis: false

targets:
  # The SwiftUI the Apple apps share: the theme, artwork, cards, chips, the
  # letter scrubber, skeletons and the empty states. Static, so the
  # Kotlin core it imports is linked once, into the app. The chips and the
  # letter scrubber are touch controls, the iPhone's alone, as is a page's
  # background under the navigation bar.
  KivoUI:
    type: framework.static
    platform: auto
    supportedDestinations: [iOS, tvOS]
    sources:
      - path: KivoUI
        excludes:
          - "Generated/**"
          - "Browse/ChipBar.swift"
          - "Browse/LetterScrubber.swift"
          - "Theme/PageBackground.swift"
      - path: KivoUI/Browse/ChipBar.swift
        group: KivoUI/Browse
        destinationFilters: [iOS]
      - path: KivoUI/Browse/LetterScrubber.swift
        group: KivoUI/Browse
        destinationFilters: [iOS]
      # The Apple TV's pages are the app's own background.
      - path: KivoUI/Theme/PageBackground.swift
        group: KivoUI/Theme
        destinationFilters: [iOS]
      - path: KivoUI/Generated/Tokens.swift
        optional: true
        group: KivoUI/Generated
    dependencies:
      - target: KivoCore
      - framework: Frameworks/KivoCore.xcframework
        embed: false
      - package: Nuke
        product: Nuke
      - package: Nuke
        product: NukeUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kivo.player.ui
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "1,2,3"

  # The iPhone and iPad app, with the code it shares with the Apple TV app.
  Kivo:
    type: application
    platform: iOS
    sources:
      - path: Kivo
      - path: Shared
      # Open source licenses' other sources: the core's libraries, which
      # scripts/build-core.sh exports with the core, and the terms no
      # package manager reports, with their texts.
      - path: Frameworks/KivoCore-licenses.json
        optional: true
        buildPhase: resources
      - path: ../../shared/credits
        type: folder
        buildPhase: resources
    postBuildScripts:
      - name: Open source licenses
        script: '"$SRCROOT/scripts/licenses.sh"'
        basedOnDependencyAnalysis: false
    preBuildScripts:
      - name: Check the build number
        script: |
          case "$CURRENT_PROJECT_VERSION" in
            [0-9]|[0-9][0-9]|[0-9][0-9][0-9]|[0-9][0-9][0-9][0-9]) ;;
            *) echo "error: CURRENT_PROJECT_VERSION $CURRENT_PROJECT_VERSION: Google Cast aborts at launch on more than four digits"; exit 1 ;;
          esac
        basedOnDependencyAnalysis: false
    dependencies:
      - target: KivoCore
      - target: KivoUI
        embed: false
      - framework: Frameworks/KivoCore.xcframework
        embed: false
      - package: Nuke
        product: NukeUI
      - package: GoogleCast
        product: GoogleCastDynamic
      - package: Libass
        product: libass
    settings:
      groups: [appVersion, coreLinking]
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(KIVO_BUNDLE_ID)
        PRODUCT_NAME: Kivo
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: Kivo/Info.plist
      properties:
        CFBundleDisplayName: Kivo
        CFBundleDevelopmentRegion: en
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # The app uses only the system's HTTPS, so App Store Connect needs no
        # export compliance answer for each build.
        ITSAppUsesNonExemptEncryption: false
        # The Facet K centred on the dark background. LaunchMark.svg is
        # shared/brand/mark.svg at 144 pt (the K about 104 pt tall),
        # re-centred on its art.
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: LaunchMark
          UIImageRespectsSafeAreaInsets: false
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Audio keeps playing in the background, for Picture in Picture and
        # books; the downloads' background refresh starts what the server
        # finished converting (DownloadRefresh).
        UIBackgroundModes:
          - audio
          - fetch
        BGTaskSchedulerPermittedIdentifiers:
          - com.kivo.player.downloads.refresh
        # Reaching a server on the local network, finding it by Bonjour as
        # the _kivo._tcp service it advertises, and finding Cast devices
        # running Kivo's receiver (app ID 2457CC30, CAST_APP_ID in the core)
        # need the person's permission.
        NSLocalNetworkUsageDescription: Kivo finds and connects to your Kivo server and Cast devices on this network.
        NSBonjourServices:
          - _kivo._tcp
          - _googlecast._tcp
          - _2457CC30._googlecast._tcp
        NSCameraUsageDescription: Kivo scans QR codes another device shows, to sign it in or to find your server.
        # kivo://link?code=…&server=…, which the web's /link page offers to a
        # phone that opened it from the system Camera.
        CFBundleURLTypes:
          - CFBundleURLName: com.kivo.player.link
            CFBundleURLSchemes:
              - kivo
        # A self-hosted server is reached at whatever address the household
        # gives it, often plain HTTP on the local network by IP or host name
        # (http://192.168.1.10:8484), so plain HTTP is allowed. (A narrower
        # NSAllowsLocalNetworking would block http to a public or .lan name,
        # and with it set, iOS ignores NSAllowsArbitraryLoads.)
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true

  # The Apple TV app, with the code it shares with the iPhone app, and the
  # Top Shelf extension, which shows Continue Watching from what the app
  # leaves in their shared app group.
  KivoTV:
    type: application
    platform: tvOS
    sources:
      - path: KivoTV
      - path: Shared
      - path: KivoTopShelf/TopShelfItems.swift
        group: KivoTopShelf
      - path: Frameworks/KivoCore-licenses.json
        optional: true
        buildPhase: resources
      - path: ../../shared/credits
        type: folder
        buildPhase: resources
    postBuildScripts:
      - name: Open source licenses
        script: '"$SRCROOT/scripts/licenses.sh"'
        basedOnDependencyAnalysis: false
    dependencies:
      - target: KivoCore
      - target: KivoUI
        embed: false
      - framework: Frameworks/KivoCore.xcframework
        embed: false
      - package: Nuke
        product: NukeUI
      - package: Libass
        product: libass
      - target: KivoTopShelf
    settings:
      groups: [appVersion, coreLinking]
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(KIVO_BUNDLE_ID)
        PRODUCT_NAME: Kivo
        TARGETED_DEVICE_FAMILY: "3"
        ASSETCATALOG_COMPILER_APPICON_NAME: App Icon & Top Shelf Image
    entitlements:
      path: KivoTV/KivoTV.entitlements
      properties:
        com.apple.security.application-groups:
          - group.$(KIVO_BUNDLE_ID)
    info:
      path: KivoTV/Info.plist
      properties:
        CFBundleDisplayName: Kivo
        CFBundleDevelopmentRegion: en
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: LaunchMark
        UIUserInterfaceStyle: Dark
        # The app group the Top Shelf extension reads Continue Watching from.
        KivoAppGroup: group.$(KIVO_BUNDLE_ID)
        # Reaching a server on the local network, and finding it by Bonjour
        # as the _kivo._tcp service it advertises.
        NSLocalNetworkUsageDescription: Kivo finds and connects to your Kivo server on this network.
        NSBonjourServices:
          - _kivo._tcp
        # kivo://work/{id} and kivo://play/{id}, which Top Shelf's items open.
        CFBundleURLTypes:
          - CFBundleURLName: com.kivo.player.link
            CFBundleURLSchemes:
              - kivo
        # A self-hosted server is often plain HTTP on the local network, as
        # the iPhone app says.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true

  KivoTopShelf:
    type: tv-app-extension
    platform: tvOS
    sources:
      - path: KivoTopShelf
    settings:
      groups: [appVersion]
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(KIVO_BUNDLE_ID).topshelf
        PRODUCT_NAME: KivoTopShelf
        TARGETED_DEVICE_FAMILY: "3"
    entitlements:
      path: KivoTopShelf/KivoTopShelf.entitlements
      properties:
        com.apple.security.application-groups:
          - group.$(KIVO_BUNDLE_ID)
    info:
      path: KivoTopShelf/Info.plist
      properties:
        CFBundleDisplayName: Kivo
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        KivoAppGroup: group.$(KIVO_BUNDLE_ID)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.tv-top-shelf
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ContentProvider

  # The Apple TV app's logic that runs without a server, hosted in the app.
  KivoTVTests:
    type: bundle.unit-test
    platform: tvOS
    sources:
      - path: KivoTVTests
    dependencies:
      - target: KivoTV
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(KIVO_BUNDLE_ID).tvtests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "3"
        # The app is named Kivo, as the iPhone's is, not after its target.
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Kivo.app/Kivo
        BUNDLE_LOADER: $(TEST_HOST)

  # Drives the Apple TV app with the remote against a real server
  # (KivoTVUITests/SignInAndPlayTests.swift says which environment it reads).
  KivoTVUITests:
    type: bundle.ui-testing
    platform: tvOS
    sources:
      - path: KivoTVUITests
    dependencies:
      - target: KivoTV
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(KIVO_BUNDLE_ID).tvuitests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "3"
        TEST_TARGET_NAME: KivoTV

  # The app's logic that runs without a server, hosted in the app.
  KivoTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: KivoTests
    dependencies:
      - target: Kivo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(KIVO_BUNDLE_ID).tests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1,2"

  # Drives the app against a real server (KivoUITests/SignInAndPlayTests.swift
  # says which environment it reads).
  KivoUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: KivoUITests
    dependencies:
      - target: Kivo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(KIVO_BUNDLE_ID).uitests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        TEST_TARGET_NAME: Kivo

schemes:
  Kivo:
    build:
      targets:
        KivoCore: all
        KivoUI: all
        Kivo: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - KivoTests
        - KivoUITests
    archive:
      config: Release
  KivoTV:
    build:
      targets:
        KivoCore: all
        KivoUI: all
        KivoTV: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - KivoTVTests
        - KivoTVUITests
    archive:
      config: Release
